name: stockmate
description: StockMate - Inventory Management App for Electrical & Electronics Store
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP Client
  dio: ^5.7.0

  # Barcode Scanner
  mobile_scanner: ^5.2.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Charts
  fl_chart: ^0.69.0

  # UI & Fonts
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  intl: 0.20.3
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
